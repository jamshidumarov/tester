name: CI/CD — Tester App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─── BUILD & TEST ───────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run tests
        run: mvn test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # ─── DOCKER IMAGE ───────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    environment: prod
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tester:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tester:${{ github.sha }}

  # ─── DEPLOY ─────────────────────────────────────────────
  deploy:
    name: Deploy to Ubuntu Server
    runs-on: ubuntu-latest
    needs: docker
    environment: prod
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/projects/tester

            # .env faylida DOCKERHUB_USERNAME o'rnatilgan bo'lishi kerak
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/tester:latest

            docker-compose down
            docker-compose up -d

            docker image prune -f

            echo "✅ Deploy muvaffaqiyatli!"
