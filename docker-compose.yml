services:

  app:
    image: ${DOCKERHUB_USERNAME}/tester:latest
    container_name: tester-app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/tester?sslmode=disable
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root123}
    ports:
      - "8085:8085"